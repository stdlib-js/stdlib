<svg xmlns="http://www.w3.org/2000/svg" width="550" height="100">
  <style>
    text { font-family: sans-serif; font-size: 16px; }
    .box { fill: none; stroke: black; stroke-width: 1.5; }
    .cross { stroke: black; stroke-width: 1.5; }
  </style>

  <!-- Title -->
  <text x="10" y="20">NaN values are skipped when updating the moving window:</text>

  <!-- Input boxes -->
  <rect x="10"  y="35" width="50" height="35" class="box"/>
  <rect x="70"  y="35" width="50" height="35" class="box"/>
  <rect x="130" y="35" width="50" height="35" class="box"/>
  <rect x="190" y="35" width="50" height="35" class="box"/>
  <rect x="250" y="35" width="50" height="35" class="box"/>

  <!-- Box labels -->
  <text x="28" y="58">2.0</text>
  <text x="88" y="58">NaN</text>
  <text x="148" y="58">4.0</text>
  <text x="208" y="58">NaN</text>
  <text x="268" y="58">3.0</text>

  <!-- Cross out NaNs -->
  <line x1="70" y1="35" x2="120" y2="70" class="cross"/>
  <line x1="70" y1="70" x2="120" y2="35" class="cross"/>

  <line x1="190" y1="35" x2="240" y2="70" class="cross"/>
  <line x1="190" y1="70" x2="240" y2="35" class="cross"/>

  <!-- Arrow -->
  <line x1="320" y1="52" x2="380" y2="52" stroke="black" stroke-width="1.5"/>
  <polygon points="380,46 395,52 380,58" fill="black"/>

  <!-- Output box -->
  <rect x="410" y="35" width="130" height="35" class="box"/>
  <text x="425" y="58">{ 2.0, 4.0, 3.0 }</text>

</svg>
